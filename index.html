<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex,nofollow">
<title>Undangan Khitanan</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
:root{--nv:#14284B;--bl:#2F6DB5;--sk:#6FB7E9;--sun:#FFC94A;--co:#FF8A5B;--cl:#F4FAFF;--ink:#1B2B45;--d:"Baloo 2","Trebuchet MS",system-ui,sans-serif;--b:Nunito,system-ui,sans-serif}
body{font:400 16px/1.7 var(--b);color:var(--ink);background:#DCEBF8;display:flex;justify-content:center}
body.lock{overflow:hidden;height:100vh}
main{width:100%;max-width:480px;background:var(--cl);overflow:hidden;box-shadow:0 0 60px rgba(20,40,75,.2)}
h1,h2,h3{font-family:var(--d);line-height:1.1;font-weight:800}
.sec{padding:50px 22px;text-align:center;position:relative}
.sec h2{font-size:1.9rem;color:var(--bl);margin-bottom:14px}
.sm{font-size:.95rem;opacity:.85;max-width:36ch;margin:0 auto}
.wv{display:block;width:100%;height:34px;margin-bottom:-1px}
/* sampul & hero: latar foto klien */
#cv,.hero{background:linear-gradient(180deg,rgba(20,40,75,.78),rgba(47,109,181,.4) 50%,rgba(20,40,75,.88)),var(--ph,none) center/cover no-repeat,linear-gradient(180deg,#14284B,#2F6DB5 60%,#6FB7E9)}
#cv{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(36px + env(safe-area-inset-top,0px)) 24px calc(34px + env(safe-area-inset-bottom,0px));text-align:center;color:#fff;transition:transform 1s cubic-bezier(.7,0,.3,1) .5s}
#cv.go{transform:translateY(-105%)}
#cv .t{font:600 1.2rem var(--d)}
#cv h1{font-size:clamp(3.4rem,18vw,5rem);text-shadow:0 4px 0 rgba(20,40,75,.45)}
#cv .nf{font-size:.95rem;opacity:.95;margin-top:4px}
#cv .to{font-size:.95rem}#cv .to b{display:block;font:800 1.4rem var(--d);margin:2px 0 18px}
.bln{position:absolute;bottom:-90px;width:46px;height:58px;border-radius:50% 50% 48% 48%/58% 58% 42% 42%;animation:rs 9s linear infinite;opacity:.9}
.bln::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:60px;background:rgba(255,255,255,.6)}
@keyframes rs{to{transform:translateY(-115vh) rotate(8deg)}}
#cv.go .bln{animation-duration:2.2s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 28px;font:700 1rem var(--d);background:var(--sun);color:var(--nv);cursor:pointer;text-decoration:none;box-shadow:0 5px 0 #D9A21E;transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #D9A21E}
.btn.o{background:#fff;color:var(--bl);box-shadow:0 5px 0 #BBD7F0}
.btn:focus-visible,.cp:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hero{min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;color:#fff;padding:40px 22px 0}
.hero .t{font:600 1.15rem var(--d)}
.hero h1{font-size:clamp(4rem,22vw,6rem);text-shadow:0 5px 0 rgba(20,40,75,.45);margin:4px 0}
.hero .full{opacity:.95;margin-bottom:16px}
.pill{background:#fff;color:var(--nv);border-radius:18px 18px 18px 4px;padding:9px 22px;font:700 1.1rem var(--d);box-shadow:0 5px 0 #BBD7F0}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;margin:22px 0 0}
.cd div{background:rgba(255,255,255,.16);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.4);border-radius:16px;padding:10px 0}
.cd b{display:block;font:800 1.7rem var(--d)}.cd small{font-size:.75rem}
.hero .wv{margin-top:26px}
/* isi */
.arch{width:230px;height:290px;margin:0 auto 20px;border-radius:115px 115px 20px 20px;border:6px solid #fff;background:var(--ph,none) center/cover,linear-gradient(160deg,#BBD7F0,#fff);box-shadow:0 14px 30px rgba(20,40,75,.25)}
.par{margin-top:16px;background:#fff;border-radius:22px 22px 4px 22px;padding:18px;box-shadow:0 6px 0 #D6E8F7}
.par span{display:block;font-size:.9rem;opacity:.75}.par b{font:800 1.2rem var(--d);color:var(--nv)}
.band{background:var(--nv);color:#fff}.band h2{color:var(--sun)}
.tk{background:#fff;color:var(--ink);border-radius:24px;padding:24px 18px;position:relative}
.tk::before,.tk::after{content:"";position:absolute;top:128px;width:26px;height:26px;border-radius:50%;background:var(--nv)}
.tk::before{left:-13px}.tk::after{right:-13px}
.dt{display:inline-block;background:linear-gradient(160deg,var(--bl),var(--sk));color:#fff;border-radius:18px;padding:8px 26px 10px;margin-bottom:22px}
.dt b{display:block;font:800 3rem var(--d)}.dt span{font:700 1.15rem var(--d)}
.tk .hr{font:800 1.35rem var(--d);color:var(--bl)}.tk .jm{font:700 1.05rem var(--d);margin:0 0 12px;padding-top:14px;border-top:2px dashed #BBD7F0}
.tk .tp{font:800 1.15rem var(--d);color:var(--nv)}.tk .al{font-size:.92rem;opacity:.8;margin:2px 0 16px}
.gl{columns:2;column-gap:8px}.gl button{display:block;width:100%;margin:0 0 8px;padding:0;border:0;border-radius:16px;overflow:hidden;cursor:zoom-in;background:#D6E8F7;break-inside:avoid;transition:transform .2s}
.gl button:hover{transform:scale(1.02)}.gl img{width:100%;display:block}
#lb{position:fixed;inset:0;z-index:60;background:rgba(10,20,40,.92);display:none;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
#lb.on{display:flex}#lb img{max-width:100%;max-height:90vh;border-radius:14px;animation:zi .3s ease}
@keyframes zi{from{transform:scale(.85);opacity:0}}
form{color:var(--ink);background:#fff;border-radius:22px;padding:18px;text-align:left;box-shadow:0 6px 0 #D6E8F7}
form label{display:block;font:700 .85rem var(--b);margin:10px 0 3px}form label:first-child{margin-top:0}
input,textarea,select{width:100%;padding:11px 12px;border:2px solid #D6E8F7;border-radius:12px;font:inherit;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:84px}
.ck{display:flex;gap:8px;align-items:center;margin:12px 0;font-size:.88rem}.ck input{width:auto}
form .btn{width:100%;margin-top:6px}
.uc{margin-top:18px;max-height:420px;overflow:auto;display:grid;gap:10px;text-align:left;padding:2px}
.bb{color:var(--ink);display:grid;grid-template-columns:42px 1fr;gap:10px;background:#fff;border-radius:18px 18px 18px 4px;padding:12px;box-shadow:0 4px 0 #D6E8F7;animation:zi .35s ease}
.av{width:42px;height:42px;border-radius:50%;color:#fff;font:800 1.15rem var(--d);display:flex;align-items:center;justify-content:center}
.bb b{font:800 1rem var(--d);color:var(--nv)}.bb em{font-style:normal;font-size:.72rem;background:#E3F4EA;color:#1f7a45;border-radius:99px;padding:1px 9px;margin-left:6px}
.bb p{font-size:.92rem;line-height:1.5;margin-top:2px}
.tm{list-style:none;padding:0;background:#fff;border-radius:22px;color:var(--ink)}.tm li{font:700 1.05rem var(--d);color:var(--nv);padding:10px 14px}.tm li+li{border-top:2px dotted #BBD7F0}
.rk{background:#fff;border-radius:18px;padding:16px;margin-top:12px;box-shadow:0 5px 0 #D6E8F7}
.rk b{font:800 1.5rem var(--d);display:block;color:var(--nv);letter-spacing:.04em}.rk small{display:block;opacity:.8}
.cp{margin-top:10px;border:2px solid var(--bl);background:transparent;color:var(--bl);border-radius:999px;padding:6px 18px;font:700 .9rem var(--b);cursor:pointer}.cp.ok{background:var(--bl);color:#fff}
.end{color:#fff;padding:70px 24px;text-align:center;background:linear-gradient(180deg,rgba(20,40,75,.7),rgba(20,40,75,.92)),var(--ph,none) center/cover,var(--nv)}
.end .nm{font:800 1.35rem var(--d);margin-top:10px;color:var(--sun)}
#to2{position:fixed;left:50%;bottom:24px;translate:-50% 0;z-index:70;background:var(--nv);color:#fff;border-radius:99px;padding:10px 22px;font:700 .9rem var(--b);opacity:0;pointer-events:none;transition:opacity .3s}
#to2.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style></head><body class="lock">

<section id="cv" aria-label="Sampul undangan">
  <div class="t">Undangan Khitanan</div>
  <div><h1 id="cvn">Raka</h1><div class="nf" id="cvf"></div></div>
  <div class="to">Kepada Yth. Bapak/Ibu/Saudara/i<b id="to">Tamu Undangan</b><button class="btn" id="buka" type="button">Buka undangan</button></div>
</section>
<main id="isi" aria-hidden="true"></main>
<div id="lb" role="dialog" aria-label="Foto"><img alt=""></div>
<div id="to2" role="status"></div>
<script src="data/data-undangan.js"></script>
<script>
(function () {
  'use strict';
  var D; try { D = DATA_UNDANGAN; } catch (x) { D = null; }
  var isi = document.getElementById('isi'), cv = document.getElementById('cv');
  if (!D) { cv.innerHTML = '<div></div><p>File data/data-undangan.js tidak ditemukan.<br>Pastikan folder data ikut terupload.</p><div></div>'; return; }
  var P = D.putra || {}, A = D.khitan || {}, G = D.galeri || [], HD = D.hadiah || [], TM = D.turutMengundang || [];
  var HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'], BLN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  function e(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function url(p) { return p ? 'url("' + encodeURI(p) + '")' : 'none'; }
  var dd = new Date((A.tanggal || '') + 'T00:00:00'), ok = !isNaN(dd);
  function jam(a) { return a.jamMulai ? a.jamMulai.replace(':', '.') + (a.jamSelesai ? ' - ' + a.jamSelesai.replace(':', '.') : ' - selesai') + ' WIB' : ''; }
  var tamu = new URLSearchParams(location.search).get('to') || 'Tamu Undangan', nama = P.panggilan || 'Putra';
  document.title = 'Undangan Khitanan ' + nama;
  document.getElementById('cvn').textContent = nama; document.getElementById('cvf').textContent = P.nama || ''; document.getElementById('to').textContent = tamu;
  cv.style.setProperty('--ph', url(D.cover || P.foto));
  var cs = ['#FFC94A', '#FF8A5B', '#6FB7E9', '#fff', '#9AD4F5'];
  for (var i = 0; i < 7; i++) { var b = document.createElement('i'); b.className = 'bln'; b.style.left = (6 + i * 14) + '%'; b.style.background = cs[i % 5]; b.style.animationDelay = (-i * 1.3) + 's'; b.style.animationDuration = (7 + i % 3 * 2) + 's'; cv.appendChild(b); }
  function wave(c) { return '<svg class="wv" viewBox="0 0 480 34" preserveAspectRatio="none" aria-hidden="true"><path fill="' + c + '" d="M0 18C80 38 160 0 240 18S400 36 480 14V34H0z"/></svg>'; }
  var h = '<header class="hero" style="--ph:' + url(P.foto || D.cover).replace(/"/g, '&quot;') + '"><div class="t">Khitanan Putra Kami</div><h1>' + e(nama) + '</h1><div class="full">' + e(P.nama) + '</div>'
    + (ok ? '<div class="pill">' + HARI[dd.getDay()] + ', ' + dd.getDate() + ' ' + BLN[dd.getMonth()] + ' ' + dd.getFullYear() + '</div>' : '')
    + '<div class="cd" id="cd"><div><b>0</b><small>Hari</small></div><div><b>0</b><small>Jam</small></div><div><b>0</b><small>Menit</small></div><div><b>0</b><small>Detik</small></div></div>' + wave('#F4FAFF') + '</header>';
  h += '<section class="sec"><h2>Assalamu’alaikum Warahmatullahi Wabarakatuh</h2><p class="sm" style="margin-bottom:22px">Dengan memohon rahmat dan ridho Allah SWT, kami mengundang Bapak/Ibu/Saudara/i untuk hadir dan mendoakan putra kami dalam acara khitanan.</p>'
    + '<div class="arch" style="--ph:' + url(D.cover && P.foto ? P.foto : (P.foto || D.cover)).replace(/"/g, '&quot;') + '"></div><h3 style="font-size:1.6rem;color:var(--nv)">' + e(P.nama) + '</h3>'
    + '<div class="par"><span>' + (P.putraKe ? 'Putra ke-' + e(P.putraKe) + ' dari' : 'Putra dari') + '</span><b>Bpk. ' + e(P.ayah) + '</b><span>dan</span><b>Ibu ' + e(P.ibu) + '</b></div></section>' + wave('#14284B').replace('<svg', '<svg style="background:var(--cl)"');
  function tiket(a) {
    var d = new Date(a.tanggal + 'T00:00:00'), v = !isNaN(d);
    return '<div class="tk">' + (v ? '<div class="dt"><b>' + d.getDate() + '</b><span>' + BLN[d.getMonth()] + ' ' + d.getFullYear() + '</span></div><div class="hr">' + HARI[d.getDay()] + '</div>' : '') + '<div class="jm">' + e(jam(a)) + '</div><div class="tp">' + e(a.tempat) + '</div><div class="al">' + e(a.alamat) + '</div>'
      + (a.maps ? '<a class="btn" href="' + e(a.maps) + '" target="_blank" rel="noopener">Buka Google Maps</a>' : '') + '</div>';
  }
  h += '<section class="sec band" style="padding-top:20px"><h2>Acara Khitanan</h2>' + tiket(A) + (D.syukuran ? '<h2 style="margin:34px 0 14px">Syukuran</h2>' + tiket(D.syukuran) : '') + '</section>';
  if (G.length) h += '<section class="sec" id="gal"><h2>Galeri Foto</h2><div class="gl">' + G.map(function (s, i) { return '<button type="button" data-i="' + i + '" aria-label="Perbesar foto ' + (i + 1) + '"><img src="' + e(s) + '" alt="Foto ' + e(nama) + ' ' + (i + 1) + '" loading="lazy"></button>'; }).join('') + '</div></section>';
  h += '<section class="sec band" id="ucs"><h2>Ucapan &amp; Doa</h2><p class="sm" style="margin-bottom:18px">Tulis ucapan dan doa untuk ' + e(nama) + '. Konfirmasi kehadiran Anda juga bisa lewat sini.</p>'
    + '<form id="fu"><label for="un">Nama</label><input id="un" required maxlength="40" value="' + (tamu === 'Tamu Undangan' ? '' : e(tamu)) + '"><label for="up">Ucapan</label><textarea id="up" required maxlength="300" placeholder="Tulis ucapan dan doa terbaik Anda"></textarea>'
    + '<label for="uh">Kehadiran</label><select id="uh"><option>Hadir</option><option>Belum bisa hadir</option><option>Masih ragu</option></select>'
    + (D.pemesan && D.pemesan.whatsapp ? '<label class="ck"><input type="checkbox" id="uw" checked> Kirim juga ke WhatsApp tuan rumah</label>' : '') + '<button class="btn" type="submit">Kirim ucapan</button></form><div class="uc" id="uc" aria-live="polite"></div></section>';
  if (TM.length) h += '<section class="sec"><h2>Turut Mengundang</h2><ul class="tm">' + TM.map(function (n) { return '<li>' + e(n) + '</li>'; }).join('') + '</ul></section>';
  if (HD.length) h += '<section class="sec" style="padding-top:10px"><h2>Tanda Kasih</h2><p class="sm">Doa restu Anda sudah menjadi hadiah terindah. Bila ingin berbagi tanda kasih, dapat melalui:</p>' + HD.map(function (r) { return '<div class="rk"><small>' + e(r.bank) + '</small><b>' + e(r.nomor) + '</b><small>a.n. ' + e(r.atasNama) + '</small><button class="cp" type="button" data-n="' + e(r.nomor) + '">Salin nomor</button></div>'; }).join('') + '</section>';
  h += '<footer class="end" style="--ph:' + url(G[0] || D.cover).replace(/"/g, '&quot;') + '"><p class="sm">Merupakan kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir dan memberikan doa restu.</p><p class="sm" style="margin-top:12px">Wassalamu’alaikum Warahmatullahi Wabarakatuh</p><div class="nm">Bpk. ' + e(P.ayah) + ' &amp; Ibu ' + e(P.ibu) + '</div></footer>';
  isi.innerHTML = h;
  function toast(t) { var x = document.getElementById('to2'); x.textContent = t; x.classList.add('on'); setTimeout(function () { x.classList.remove('on'); }, 2200); }
  /* galeri + pembesar foto */
  var lb = document.getElementById('lb'), li = lb.firstElementChild;
  [].forEach.call(isi.querySelectorAll('.gl button'), function (bt) {
    bt.firstElementChild.onerror = function () { bt.remove(); if (!isi.querySelector('.gl button')) { var s = document.getElementById('gal'); if (s) s.remove(); } };
    bt.onclick = function () { li.src = G[bt.getAttribute('data-i')]; lb.classList.add('on'); };
  });
  lb.onclick = function () { lb.classList.remove('on'); };
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') lb.classList.remove('on'); });
  /* ucapan: daftar dari data + ucapan yang ditulis di perangkat ini */
  var KEY = 'ucapan-' + nama + '-' + (A.tanggal || ''), mine = [];
  try { mine = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (x) { mine = []; }
  var uc = document.getElementById('uc'), warna = ['#2F6DB5', '#FF8A5B', '#3B9E78', '#8E6BBF', '#D9A21E', '#D6517D'];
  function bubble(u, baru) {
    var d = document.createElement('div'), a = document.createElement('div'), c = document.createElement('div'), b = document.createElement('b'), p = document.createElement('p');
    d.className = 'bb'; a.className = 'av'; a.textContent = String(u.nama || '?').charAt(0).toUpperCase(); a.style.background = warna[(String(u.nama).length + String(u.nama).charCodeAt(0)) % 6];
    b.textContent = u.nama; if (u.hadir) { var m = document.createElement('em'); m.textContent = u.hadir; b.appendChild(m); } p.textContent = u.pesan; c.appendChild(b); c.appendChild(p); d.appendChild(a); d.appendChild(c);
    if (baru) uc.insertBefore(d, uc.firstChild); else uc.appendChild(d);
  }
  mine.forEach(function (u) { bubble(u); }); (D.ucapan || []).forEach(function (u) { bubble(u); });
  if (!uc.children.length) { uc.innerHTML = '<p class="sm" style="text-align:center;color:#fff">Belum ada ucapan. Jadilah yang pertama.</p>'; }
  document.getElementById('fu').onsubmit = function (ev) {
    ev.preventDefault();
    var u = {nama: document.getElementById('un').value.trim(), pesan: document.getElementById('up').value.trim(), hadir: document.getElementById('uh').value};
    if (!u.nama || !u.pesan) return;
    if (!uc.querySelector('.bb')) uc.textContent = ''; bubble(u, true); mine.unshift(u); try { localStorage.setItem(KEY, JSON.stringify(mine.slice(0, 30))); } catch (x) {}
    document.getElementById('up').value = ''; toast('Ucapan terkirim. Terima kasih!'); uc.scrollTop = 0;
    var w = document.getElementById('uw'), no = String(D.pemesan && D.pemesan.whatsapp || '').replace(/\D/g, '');
    if (w && w.checked && no) window.open('https://wa.me/' + no + '?text=' + encodeURIComponent('Assalamu’alaikum, saya ' + u.nama + '. Ucapan untuk ' + nama + ': ' + u.pesan + ' (Kehadiran: ' + u.hadir + ')'), '_blank');
  };
  [].forEach.call(isi.querySelectorAll('.cp'), function (b) {
    b.onclick = function () {
      var n = b.getAttribute('data-n'), done = function () { b.textContent = 'Tersalin'; b.classList.add('ok'); setTimeout(function () { b.textContent = 'Salin nomor'; b.classList.remove('ok'); }, 1800); };
      if (navigator.clipboard) navigator.clipboard.writeText(n).then(done, function () { prompt('Salin nomor:', n); }); else prompt('Salin nomor:', n);
    };
  });
  /* hitung mundur */
  var T = new Date(A.tanggal + 'T' + (A.jamMulai || '00:00') + ':00').getTime(), cd = document.getElementById('cd'), iv;
  function tick() {
    var s = Math.floor((T - Date.now()) / 1000), b = cd.querySelectorAll('b');
    if (isNaN(s)) { cd.hidden = true; clearInterval(iv); return; }
    if (s <= 0) { cd.outerHTML = '<div class="pill" style="margin-top:20px">Acara sedang atau telah berlangsung</div>'; clearInterval(iv); return; }
    b[0].textContent = Math.floor(s / 86400); b[1].textContent = Math.floor(s % 86400 / 3600); b[2].textContent = Math.floor(s % 3600 / 60); b[3].textContent = s % 60;
  }
  iv = setInterval(tick, 1000); tick();
  document.getElementById('buka').onclick = function () {
    cv.classList.add('go'); document.body.classList.remove('lock'); isi.removeAttribute('aria-hidden'); window.scrollTo(0, 0);
    setTimeout(function () { cv.style.display = 'none'; }, 1800);
  };
})();
</script>
</body></html>
